> Compose local do Atlas Storefront — profiles `core` (aplicações) e `data` (estores).
> Execução requer Docker (hoje ausente no host — EVD-000-003; gates dependentes BLOCKED).
> Mongo em replica set é OBRIGATÓRIO para transações/outbox (ADR-0002/0003).
> Versões pinadas por tag patch; substituir por digest no M8 (produção-alvo).

services:
  catalog-api:
    image: atlas/catalog-api:0.1.0-dev   # construir no M1 quando imagens existirem
    profiles: [core]
    ports: ["8080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on: [mongo1, postgres, redis, keycloak]

  # ---- data ----
  mongo1:
    image: mongo:7.0.14
    profiles: [data]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo1:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongo-init:  # inicializa o replica set single-node (dev)
    image: mongo:7.0.14
    profiles: [data]
    depends_on: { mongo1: { condition: service_healthy } }
    restart: "no"
    entrypoint: >
      mongosh --host mongo1 --eval '
      try { rs.status().ok } catch (e) {
        rs.initiate({_id:"rs0", members:[{_id:0, host:"mongo1:27017"}]});
      }'

  postgres:
    image: postgres:17.2
    profiles: [data]
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_only
      POSTGRES_DB: atlas_read
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4.1
    profiles: [data]
    ports: ["6379:6379"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: [data]
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_only
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../../atlas-platform-contracts-dotnet/infrastructure/iam/realm-atlas.json:/opt/keycloak/data/import/realm-atlas.json:ro
    ports: ["8090:8080"]

volumes:
  mongo1: {}
  pg: {}
