apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-storefront
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls: [{ hosts: ["atlas.local"], secretName: atlas-tls }]
  rules:
    - host: atlas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: atlas-gateway, port: { number: 80 } } }
