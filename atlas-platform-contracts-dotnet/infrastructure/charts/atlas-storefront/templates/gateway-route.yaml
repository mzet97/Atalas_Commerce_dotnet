apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlas-gateway
  namespace: dotnet-atlas
spec:
  parentRefs:
  - name: homelab-gateway
    namespace: kube-system
  hostnames:
  - gateway.home.arpa
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: atlas-gateway
      port: 80
