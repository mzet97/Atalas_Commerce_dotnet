{{- range $name, $cfg := .Values.atlasService }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-{{ $name }}
  labels:
    app: atlas-{{ $name }}
    app.kubernetes.io/part-of: atlas-commerce
spec:
  replicas: {{ $cfg.replicaCount }}
  selector:
    matchLabels:
      app: atlas-{{ $name }}
  template:
    metadata:
      labels:
        app: atlas-{{ $name }}
        app.kubernetes.io/part-of: atlas-commerce
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $cfg.containerPort }}
            {{- range $cfg.extraPorts }}
            - containerPort: {{ .targetPort }}
              name: {{ .name }}
            {{- end }}
          env:
            {{- range $cfg.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range $cfg.secrets }}
            - name: {{ .envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          {{- if and $cfg.probes $cfg.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ $cfg.probes.path }}
              port: {{ $cfg.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ $cfg.probes.path }}
              port: {{ $cfg.containerPort }}
            initialDelaySeconds: 8
            periodSeconds: 5
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-{{ $name }}
spec:
  selector:
    app: atlas-{{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: {{ $cfg.containerPort }}
    {{- range $cfg.extraPorts }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
    {{- end }}
---
{{- if $cfg.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas-{{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas-{{ $name }}
  minReplicas: {{ $cfg.hpa.minReplicas }}
  maxReplicas: {{ $cfg.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.hpa.cpuTargetPercent }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-{{ $name }}-deny-by-default
spec:
  podSelector:
    matchLabels:
      app: atlas-{{ $name }}
  policyTypes: [Ingress]
  ingress:
    {{- if $cfg.networkPolicy.allowFromApp }}
    - from:
        - podSelector:
            matchLabels:
              app: atlas-{{ $cfg.networkPolicy.allowFromApp }}
      ports:
        - protocol: TCP
          port: {{ $cfg.containerPort }}
        {{- range $cfg.extraPorts }}
        - protocol: TCP
          port: {{ .targetPort }}
        {{- end }}
    {{- end }}
    {{- if $cfg.networkPolicy.allowSameNamespace }}
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ $cfg.containerPort }}
        {{- range $cfg.extraPorts }}
        - protocol: TCP
          port: {{ .targetPort }}
        {{- end }}
    {{- end }}
    {{- range $cfg.networkPolicy.allowFromNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - protocol: TCP
          port: {{ $cfg.containerPort }}
    {{- end }}
    {{- if and (not $cfg.networkPolicy.allowFromApp) (not $cfg.networkPolicy.allowSameNamespace) (not $cfg.networkPolicy.allowFromNamespaces) }}
    - from: []
    {{- end }}
{{- end }}
{{- end }}
