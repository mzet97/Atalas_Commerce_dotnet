# F4 deploy no k8s .51 (ns dotnet-atlas). Imagens locais importadas.
host:
  enabled: true
  image: { repository: atlas/control-host, tag: "local-f12" }
  containerPort: 8080
  replicaCount: 1
  hpa: { enabled: false, minReplicas: 2, maxReplicas: 4, cpuTargetPercent: 70 }
  probes: { enabled: true, path: /health }
  env:
    - name: Mongo__Database
      value: atlas_control
    - name: Keycloak__Authority
      value: http://keycloak.keycloak.svc:8080/realms/atlas
    - name: CatalogOwner__Url
      value: http://atlas-catalog-api.dotnet-atlas:81
    - name: InventoryOwner__Url
      value: http://atlas-inventory-api.dotnet-atlas:81
    - name: Kestrel__Endpoints__Http__Url
      value: http://+:8080
  secrets:
    - envName: Mongo__ConnectionString
      name: atlas-data
      key: mongo-connstr
    - envName: Approval__TokenSecret
      name: atlas-hmac
      key: approval-token-secret
web:
  enabled: true
  image: { repository: atlas/control-web, tag: "local-f14" }
  containerPort: 4200
