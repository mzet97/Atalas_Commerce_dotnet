# Modelo: atlas-hmac (ns dotnet-atlas) — VALORES FICTÍCIOS, nunca commitar reais.
# Criação (com valores reais fora do git — gerar com: openssl rand -hex 32):
#   kubectl -n dotnet-atlas create secret generic atlas-hmac \
#     --from-literal=consent-secret="$(openssl rand -hex 32)" \
#     --from-literal=approval-token-secret="$(openssl rand -hex 32)" \
#     --from-literal=psp-webhook-secret="$(openssl rand -hex 32)"
# Consumidores: assistant (Consent__Secret), payments (Approval__TokenSecret,
# Psp__WebhookSecret), psp-fake e control (mesmos segredos compartilhados).
# ATENÇÃO: os três segredos devem ser IDÊNTICOS entre os serviços que os consomem.
apiVersion: v1
kind: Secret
metadata:
  name: atlas-hmac
  namespace: dotnet-atlas
type: Opaque
stringData:
  consent-secret: "TROCAR-com-openssl-rand-hex-32"
  approval-token-secret: "TROCAR-com-openssl-rand-hex-32"
  psp-webhook-secret: "TROCAR-com-openssl-rand-hex-32"
