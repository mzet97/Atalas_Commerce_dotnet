# Modelo: atlas-data (ns dotnet-atlas) — VALORES FICTÍCIOS, nunca commitar reais.
# Criação (com valores reais fora do git):
#   kubectl -n dotnet-atlas create secret generic atlas-data \
#     --from-literal=mongo-connstr='mongodb://admin:<senha>@mongodb-headless.mongodb.svc:27017/?replicaSet=rs0&authSource=admin' \
#     --from-literal=pg-connstr='Host=192.168.1.52;Port=5432;Database=atlas_read;Username=app_service;Password=<senha>;SSL Mode=Disable' \
#     --from-literal=redis-connstr='redis-master.redis.svc:6379' \
#     --from-literal=rabbit-url='amqp://atlas:<senha>@rabbitmq.rabbitmq.svc:5672/'
# Consumidores: charts atlas-storefront/atlas-control (secretKeyRef atlas-data).
apiVersion: v1
kind: Secret
metadata:
  name: atlas-data
  namespace: dotnet-atlas
type: Opaque
stringData:
  mongo-connstr: "mongodb://admin:TROCAR@mongodb-headless.mongodb.svc:27017/?replicaSet=rs0&authSource=admin"
  pg-connstr: "Host=192.168.1.52;Port=5432;Database=atlas_read;Username=app_service;Password=TROCAR;SSL Mode=Disable"
  redis-connstr: "redis-master.redis.svc:6379"
  rabbit-url: "amqp://atlas:TROCAR@rabbitmq.rabbitmq.svc:5672/"
