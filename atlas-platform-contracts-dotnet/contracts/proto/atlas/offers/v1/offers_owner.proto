syntax = "proto3";

package atlas.offers.v1;

// Contrato Admin → Offers owner. Draft v1 (SPEC-002).

option csharp_namespace = "Atlas.Contracts.Offers.V1";

service OffersOwnerService {
  rpc PublishOffer(PublishOfferRequest) returns (PublishOfferResponse);
  rpc GetActiveOffer(GetActiveOfferRequest) returns (GetActiveOfferResponse);
  // Gestão pelo Control (ERP master data): reprice com CAS + desativação.
  rpc UpdateOfferPrice(UpdateOfferPriceRequest) returns (UpdateOfferPriceResponse);
  rpc DeactivateOffer(DeactivateOfferRequest) returns (DeactivateOfferResponse);
  // Grade do Control: ofertas ativas com filtro de mercado (leitura operacional).
  rpc ListActiveOffers(ListActiveOffersRequest) returns (ListActiveOffersResponse);
}

message PublishOfferRequest {
  string request_id = 1;
  string actor_sub = 2;
  string approval_token = 3;   // obrigatório acima do limite de desconto
  string sku_id = 4;
  string seller_id = 5;        // 1P = seller da plataforma
  string market_id = 6;
  string channel = 7;
  string currency = 8;         // ISO 4217
  int64 price_minor = 9;       // INV-MONEY-001
  int64 list_price_minor = 10;
  string valid_from = 11;      // RFC3339 UTC
  string valid_to = 12;
  string correlation_id = 13;
}

message PublishOfferResponse {
  bool accepted = 1;
  string offer_id = 2;
  int64 aggregate_version = 3;
  string reason = 4;           // ex.: escopo já possui oferta ativa
}

message GetActiveOfferRequest {
  string sku_id = 1;
  string market_id = 2;
  string channel = 3;
  string currency = 4;
}

message GetActiveOfferResponse {
  string offer_id = 1;
  int64 price_minor = 2;
  string valid_to = 3;
  int64 aggregate_version = 4;
}

message UpdateOfferPriceRequest {
  string request_id = 1;
  string actor_sub = 2;
  string offer_id = 3;
  int64 expected_version = 4; // concorrência otimista
  int64 price_minor = 5;      // mesma moeda da oferta (troca de moeda = nova oferta)
  string correlation_id = 6;
}

message UpdateOfferPriceResponse {
  bool accepted = 1;
  int64 aggregate_version = 2;
  string event_id = 3;        // PriceChanged
  string reason = 4;
}

message DeactivateOfferRequest {
  string request_id = 1;
  string actor_sub = 2;
  string offer_id = 3;
  int64 expected_version = 4;
  string correlation_id = 5;
}

message DeactivateOfferResponse {
  bool accepted = 1;
  int64 aggregate_version = 2;
  string event_id = 3;        // OfferDeactivated
  string reason = 4;
}

message OfferView {
  string offer_id = 1;
  string sku_id = 2;
  string seller_id = 3;
  string market_id = 4;
  string channel = 5;
  string currency = 6;
  int64 price_minor = 7;
  int64 list_price_minor = 8;
  int64 aggregate_version = 9;
  string valid_to = 10;
}

message ListActiveOffersRequest {
  string market_id = 1; // vazio = todos
  string sku_id = 2;    // vazio = todos
  int32 page = 3;
  int32 page_size = 4;
}

message ListActiveOffersResponse {
  repeated OfferView items = 1;
  int64 total = 2;
}
