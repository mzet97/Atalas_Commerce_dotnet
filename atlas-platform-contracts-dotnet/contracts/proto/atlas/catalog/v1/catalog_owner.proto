syntax = "proto3";

package atlas.catalog.v1;

// Contrato Admin→Owner (Control → Catalog). Draft v1 (SPEC-002).
// Identidades fortes como string (UUIDv7); Money em minor units por design INV-MONEY-001.

option csharp_namespace = "Atlas.Contracts.Catalog.V1";

service CatalogOwnerService {
  // Cria/atualiza rascunho de produto (idempotente por request_id).
  rpc UpsertDraft(UpsertDraftRequest) returns (UpsertDraftResponse);
  // Submete rascunho para aprovação (UC-005: estado PendingApproval pré-publish).
  rpc SubmitForApproval(SubmitForApprovalRequest) returns (SubmitForApprovalResponse);
  // Publica produto previamente aprovado no Control (approval_token assinado).
  rpc PublishProduct(PublishProductRequest) returns (PublishProductResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  // Grade do Control: lista paginada com filtros (leitura operacional, sem mutação).
  rpc ListDrafts(ListDraftsRequest) returns (ListDraftsResponse);
  // Atualiza rascunho (títulos/atributos; SKUs continuam append-only; CAS por versão).
  rpc UpdateDraft(UpdateDraftRequest) returns (UpdateDraftResponse);
  // Remove rascunho nunca publicado (Draft apenas; sem evento).
  rpc DeleteDraft(DeleteDraftRequest) returns (DeleteDraftResponse);
  // Tira produto da venda (Published -> Unpublished + Product.UnpublishedV1; four-eyes).
  rpc UnpublishProduct(UnpublishProductRequest) returns (UnpublishProductResponse);
  // Emite URL pré-assinada PUT (MinIO/S3) para upload direto do browser.
  // Owner valida actor/content-type/tamanho ANTES de assinar; bytes vão ao S3.
  rpc RequestImageUpload(RequestImageUploadRequest) returns (RequestImageUploadResponse);
  // Anexa objeto já enviado ao S3 (owner confere via HEAD: chave, tipo, tamanho; CAS).
  rpc AttachImage(AttachImageRequest) returns (AttachImageResponse);
  // Remove imagem do draft (qualquer estado; CAS).
  rpc DetachImage(DetachImageRequest) returns (DetachImageResponse);
}

message ImageView {
  string key = 1;          // object key no bucket (ex. products/{id}/{guid}.jpg)
  string content_type = 2; // image/jpeg | image/png | image/webp
  int64 size_bytes = 3;
}

message RequestImageUploadRequest {
  string request_id = 1;
  string actor_sub = 2;
  string product_id = 3;
  string content_type = 4; // allowlist: image/jpeg | image/png | image/webp
  int64 content_length = 5; // teto 5 MiB (barrado aqui; HEAD revalida no attach)
}

message RequestImageUploadResponse {
  bool accepted = 1;
  string reason = 2;        // vazio se aceito
  string upload_url = 3;    // PUT pré-assinado (TTL curto)
  string object_key = 4;    // chave a anexar depois
  string expires_at_utc = 5;
}

message AttachImageRequest {
  string request_id = 1;
  string actor_sub = 2;
  string product_id = 3;
  int64 expected_version = 4; // concorrência otimista
  string object_key = 5;
}

message AttachImageResponse {
  bool accepted = 1;
  int64 aggregate_version = 2;
  string reason = 3;
}

message DetachImageRequest {
  string request_id = 1;
  string actor_sub = 2;
  string product_id = 3;
  int64 expected_version = 4;
  string object_key = 5;
}

message DetachImageResponse {
  bool accepted = 1;
  int64 aggregate_version = 2;
  string reason = 3;
}

message UpsertDraftRequest {
  string request_id = 1;      // idempotency key
  string actor_sub = 2;       // operador autenticado (audit)
  string correlation_id = 3;
  string product_id = 4;      // vazio = criar
  string category_id = 5;
  repeated LocalizedText titles = 6;
  repeated LocalizedText descriptions = 7;
  repeated SkuDraft skus = 8;
  map<string, string> attributes = 9;
}

message LocalizedText {
  string locale = 1;          // pt-BR | en-US | es-ES
  string text = 2;
}

message SkuDraft {
  string sku_id = 1;
  string sku_code = 2;
  map<string, string> variant_attributes = 3;
}

message UpsertDraftResponse {
  string product_id = 1;
  int64 aggregate_version = 2;
  bool accepted = 3;
  string reason = 4;          // vazio se accepted
}

message PublishProductRequest {
  string request_id = 1;
  string approval_token = 2;  // token assinado pelo Control (ADR four-eyes)
  string product_id = 3;
  int64 expected_version = 4; // concorrência otimista
  string market_id = 5;
}

message PublishProductResponse {
  bool accepted = 1;
  int64 aggregate_version = 2;
  string event_id = 3;        // ProductPublished
  string reason = 4;
}

message GetProductRequest { string product_id = 1; string locale = 2; }

message GetProductResponse {
  string product_id = 1;
  string status = 2;
  int64 aggregate_version = 3;
  repeated LocalizedText titles = 4;
  repeated SkuView skus = 5;
  repeated ImageView images = 6; // ordem de anexo; [0] = capa
}

message ListDraftsRequest {
  string status = 1;       // Draft|PendingApproval|Published|Unpublished (vazio = todos)
  string market_id = 2;
  string search = 3;        // título ou sku_code (case-insensitive)
  int32 page = 4;
  int32 page_size = 5;
}

message ListDraftsResponse {
  repeated DraftView items = 1;
  int64 total = 2;
}

message DraftView {
  string product_id = 1;
  string status = 2;
  int64 aggregate_version = 3;
  string market_id = 4;
  repeated LocalizedText titles = 5;
  int32 sku_count = 6;
  string created_by = 7;
  repeated ImageView images = 8; // grade do Control exibe a capa ([0])
}

message UpdateDraftRequest {
  string request_id = 1;
  string actor_sub = 2;
  string product_id = 3;
  int64 expected_version = 4; // concorrência otimista
  repeated LocalizedText titles = 5;
  map<string, string> attributes = 6;
}

message UpdateDraftResponse {
  string product_id = 1;
  int64 aggregate_version = 2;
  bool accepted = 3;
  string reason = 4;          // vazio se aceito
}

message DeleteDraftRequest {
  string product_id = 1;
  string actor_sub = 2;
}

message DeleteDraftResponse {
  bool accepted = 1;
  string reason = 2;
}

message UnpublishProductRequest {
  string request_id = 1;
  string approval_token = 2;  // token HMAC do Control (four-eyes)
  string product_id = 3;
  int64 expected_version = 4;
  string market_id = 5;
  string reason = 6;          // auditoria (motivo da retirada)
}

message UnpublishProductResponse {
  bool accepted = 1;
  int64 aggregate_version = 2;
  string event_id = 3;        // ProductUnpublished
  string reason = 4;
}

message SkuView { string sku_id = 1; string sku_code = 2; }

message SubmitForApprovalRequest {
  string request_id = 1;
  string actor_sub = 2;
  string product_id = 3;
  int64 expected_version = 4;
}

message SubmitForApprovalResponse {
  bool accepted = 1;
  int64 aggregate_version = 2;
  string reason = 3;
}
