name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-storefront-dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Build
        run: dotnet build Atlas.Storefront.slnx
      - name: Test — Domain
        run: dotnet test tests/Atlas.Catalog.Domain.Tests/Atlas.Catalog.Domain.Tests.csproj --no-build
      - name: Test — Api
        run: dotnet test tests/Atlas.Catalog.Api.Tests/Atlas.Catalog.Api.Tests.csproj --no-build
      - name: Test — Checkout Application
        run: dotnet test tests/Atlas.Checkout.Application.Tests/Atlas.Checkout.Application.Tests.csproj --no-build
      - name: Test — Shopping Assistant (fake CI)
        run: dotnet test tests/Atlas.ShoppingAssistant.Tests/Atlas.ShoppingAssistant.Tests.csproj --no-build --filter "RequiresOllama!=true"

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-platform-contracts-dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Build
        run: |
          dotnet build src/Atlas.Contracts.Grpc/Atlas.Contracts.Grpc.csproj
      - name: Test
        run: |
          dotnet test tests/Atlas.Contracts.Events.Tests/Atlas.Contracts.Events.Tests.csproj --no-build || dotnet test tests/Atlas.Contracts.Events.Tests/Atlas.Contracts.Events.Tests.csproj
